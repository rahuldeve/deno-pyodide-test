[project]
name = "pyodide-sandbox"
version = "0.1.0"
description = "A pydantic-ai REPL capability that runs Python in Pyodide on Deno, one process per session"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic]>=2.63.0",
    "pydantic-ai-harness>=0.63.0",
    "numpy==2.4.6",
    "pandas==3.0.2",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyodide_sandbox"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.poe.tasks]
fetch = { cmd = "python scripts/fetch_pyodide.py", help = "Download the full Pyodide distribution into ./pyodide-dist (or $PYODIDE_DIST_DIR)" }
deno-install = { shell = "cd deno && ${DENO:-$HOME/.deno/bin/deno} install", help = "Install the pinned pyodide npm package into deno/node_modules" }
setup = { sequence = ["fetch", "deno-install"], help = "Everything the sandbox needs on disk (needs network once)" }
agent = { cmd = "python scripts/run_agent_repl.py", help = "Let a pydantic-ai agent analyse data in the Pyodide REPL (needs ANTHROPIC_API_KEY)" }
test = { cmd = "pytest", help = "Run the tests" }
fmt = { cmd = "ruff format", help = "Format the code" }
lint = { cmd = "ruff check", help = "Lint the code" }

[tool.pytest.ini_options]
testpaths = ["tests"]
